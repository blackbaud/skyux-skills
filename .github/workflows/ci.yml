name: ci

on:
  push:
    branches: [main]
    tags: ['*-v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: 'Force verify-release to fail (Slack alerting smoke test)'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']

jobs:
  lint:
    if: github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate marketplace.json shape
        run: |
          node <<'NODE'
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('.claude-plugin/marketplace.json', 'utf8'));
          const ok = (cond, msg) => { if (!cond) { console.error(msg); process.exit(1); } };
          ok(typeof m.name === 'string' && m.name, 'marketplace.name missing');
          ok(m.owner && typeof m.owner.name === 'string', 'marketplace.owner.name missing');
          ok(Array.isArray(m.plugins) && m.plugins.length > 0, 'marketplace.plugins must be a non-empty array');
          for (const p of m.plugins) {
            for (const field of ['name', 'source', 'description', 'version']) {
              ok(typeof p[field] === 'string' && p[field], `plugin missing or empty field: ${field} (entry: ${JSON.stringify(p)})`);
            }
          }
          console.log('marketplace.json: OK');
          NODE

      - name: Validate SKILL.md to marketplace.json consistency
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const m = JSON.parse(fs.readFileSync('.claude-plugin/marketplace.json', 'utf8'));
          const parseFrontmatter = (raw) => {
            const match = raw.match(/^---\n([\s\S]*?)\n---/);
            if (!match) throw new Error('missing YAML frontmatter');
            const fm = {};
            for (const line of match[1].split('\n')) {
              const m2 = line.match(/^([a-zA-Z_][\w-]*):\s*(.*)$/);
              if (m2) fm[m2[1]] = m2[2];
            }
            return fm;
          };
          for (const p of m.plugins) {
            const skillPath = path.join(p.source, 'SKILL.md');
            if (!fs.existsSync(skillPath)) {
              console.error(`plugin ${p.name}: SKILL.md missing at ${skillPath}`);
              process.exit(1);
            }
            const fm = parseFrontmatter(fs.readFileSync(skillPath, 'utf8'));
            if (fm.name !== p.name) {
              console.error(`plugin ${p.name}: SKILL.md frontmatter name="${fm.name}" does not match marketplace name="${p.name}"`);
              process.exit(1);
            }
            if (fm.description !== p.description) {
              console.error(`plugin ${p.name}: SKILL.md description does not match marketplace description`);
              console.error(`  SKILL.md:    ${fm.description}`);
              console.error(`  marketplace: ${p.description}`);
              process.exit(1);
            }
          }
          console.log('SKILL.md to marketplace.json: OK');
          NODE

      - name: Validate references/_manifest.json
        run: |
          node <<'NODE'
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('skills/skyux-sidekick/references/_manifest.json', 'utf8'));
          if (!m.generated_at) { console.error('_manifest.json missing generated_at'); process.exit(1); }
          console.log('_manifest.json: OK');
          NODE

      - name: Validate AGENTS.md is a symlink to CLAUDE.md
        run: |
          if [ ! -L AGENTS.md ]; then
            echo "AGENTS.md is not a symlink" >&2
            exit 1
          fi
          if [ "$(readlink AGENTS.md)" != "CLAUDE.md" ]; then
            echo "AGENTS.md does not resolve to CLAUDE.md (got: $(readlink AGENTS.md))" >&2
            exit 1
          fi
          echo "AGENTS.md: OK"

      - name: Validate required root files exist
        run: |
          for f in LICENSE README.md CONTRIBUTING.md CLAUDE.md .gitattributes; do
            if [ ! -f "$f" ]; then
              echo "missing required file: $f" >&2
              exit 1
            fi
          done
          echo "root files: OK"

      - name: Run verify-release tests
        run: node --test scripts/verify-release.test.mjs

  verify-release:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Parse tag (or simulate failure on workflow_dispatch)
        id: parse
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.simulate_failure }}" = "true" ]; then
              echo "simulate_failure=true requested; failing verify-release deliberately" >&2
              exit 1
            else
              echo "workflow_dispatch with simulate_failure=false; nothing to verify, succeeding" >&2
              exit 0
            fi
          fi
          TAG="${GITHUB_REF#refs/tags/}"
          NAME="${TAG%-v*}"
          VERSION="${TAG##*-v}"
          if [ -z "$NAME" ] || [ -z "$VERSION" ] || [ "$NAME" = "$TAG" ]; then
            echo "tag does not match <name>-v<version>: $TAG" >&2
            exit 1
          fi
          echo "name=$NAME"      >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Run verify-release.mjs
        if: github.event_name == 'push'
        run: node scripts/verify-release.mjs "${{ steps.parse.outputs.name }}" "${{ steps.parse.outputs.version }}"

  slack-on-failure:
    needs: verify-release
    if: ${{ failure() && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check webhook secret presence
        id: secret
        run: |
          if [ -z "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SLACK_WEBHOOK_URL not set; skipping Slack notification."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      # renovate: datasource=github-tags depName=rtCamp/action-slack-notify
      - name: Send Slack alert
        if: ${{ steps.secret.outputs.present == 'true' }}
        uses: rtCamp/action-slack-notify@e31e87e03dd19038e411e38ae27cbad084a90661  # v2.3.3
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_TITLE: "skyux-skills release verification failed"
          SLACK_MESSAGE: "Tag/ref: ${{ github.ref }}\nCommit: ${{ github.sha }}\nWorkflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\nFix forward — do NOT retag. Bump to the next version and push the new tag."
          SLACK_COLOR: danger
